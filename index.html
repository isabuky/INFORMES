<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Policía Portuaria · Puerto de Gijón — Generador de Informes</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Informes PP">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
/* ===================== iOS DESIGN SYSTEM — Paleta Policía Portuaria ===================== */
:root{
  --pp-azul:#0f2a5c; --pp-azul-claro:#1e3a8a; --pp-dorado:#b08d3f; --pp-dorado-claro:#d4af37; --pp-rojo:#b91c1c;
  --ios-bg:#f1f5f9; --ios-card:#ffffff; --ios-separator:#e2e8f0; --ios-label:#0f172a; --ios-secondary:#64748b;
  --ios-blue:#2563eb; --ios-green:#16a34a; --ios-red:#dc2626; --ios-orange:#d97706;
  --ios-radius:12px; --ios-radius-lg:16px; --ios-radius-sm:8px;
  --ios-shadow:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --ios-shadow-lg:0 4px 16px rgba(0,0,0,0.08),0 1px 4px rgba(0,0,0,0.04);
  --ios-transition:0.2s cubic-bezier(0.25,0.1,0.25,1);
}
*{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif; box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;width:100%;background:var(--ios-bg);color:var(--ios-label);}

/* HEADER */
.pp-header{background:linear-gradient(120deg,var(--pp-azul) 0%,var(--pp-azul-claro) 55%,var(--pp-azul) 100%);
  border-bottom:3px solid var(--pp-dorado); box-shadow:0 2px 10px rgba(15,42,92,0.35);
  position:sticky; top:0; z-index:40;}
.pp-header-inner{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.pp-logo{height:44px;width:auto;border-radius:8px;flex-shrink:0;}
.pp-brand{display:flex;align-items:center;gap:10px;color:#fff;}
.pp-brand-title{font-weight:700;letter-spacing:-0.2px;font-size:0.98rem;line-height:1.25;}
.pp-brand-title small{display:block;font-size:0.62rem;font-weight:600;letter-spacing:0.8px;color:var(--pp-dorado-claro);text-transform:uppercase;opacity:0.9;}
.pp-header-actions{display:flex;gap:8px;flex-wrap:wrap;}

/* BUTTONS */
.ios-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--ios-radius-sm);
  font-size:0.8125rem;font-weight:600;letter-spacing:-0.1px;transition:all var(--ios-transition);
  -webkit-tap-highlight-color:transparent;border:none;cursor:pointer;white-space:nowrap;}
.ios-btn:active{transform:scale(0.97);opacity:0.85;}
.ios-btn-primary{background:var(--ios-blue);color:#fff;}
.ios-btn-success{background:var(--ios-green);color:#fff;}
.ios-btn-danger{background:var(--ios-red);color:#fff;}
.ios-btn-secondary{background:rgba(255,255,255,0.15);color:#fff;backdrop-filter:blur(8px);}
.ios-btn-secondary.light{background:rgba(120,120,128,0.12);color:var(--ios-blue);}
.ios-btn-gold{background:linear-gradient(135deg,var(--pp-dorado),var(--pp-dorado-claro));color:#fff;}
.ios-btn-sm{padding:7px 12px;font-size:0.72rem;}
.ios-btn:disabled{opacity:0.4;cursor:not-allowed;}

/* CARDS */
.ios-card{background:var(--ios-card);border-radius:var(--ios-radius-lg);box-shadow:var(--ios-shadow);border:0.5px solid rgba(0,0,0,0.04);}

/* INPUTS */
.ios-input,.ios-select,textarea.ios-input{width:100%;padding:10px 14px;border-radius:var(--ios-radius-sm);
  border:0.5px solid var(--ios-separator);background:var(--ios-card);font-size:0.9375rem;color:var(--ios-label);
  outline:none;transition:border-color var(--ios-transition);}
textarea.ios-input{resize:vertical;line-height:1.5;font-family:inherit;}
.ios-input:focus,.ios-select:focus,textarea.ios-input:focus{border-color:var(--ios-blue);box-shadow:0 0 0 3px rgba(37,99,235,0.15);}
.ios-label-field{font-size:0.72rem;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;color:var(--ios-secondary);margin-bottom:5px;display:block;}
.digit-box{width:30px;height:38px;text-align:center;font-weight:700;font-size:1.05rem;border:1.5px solid var(--ios-separator);
  border-radius:6px;padding:0;}
.digit-box:focus{border-color:var(--ios-blue);box-shadow:0 0 0 3px rgba(37,99,235,0.15);}

/* LAYOUT */
.app-wrap{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:280px 1fr;gap:16px;}
@media (max-width:860px){.app-wrap{grid-template-columns:1fr;}}
.section-title{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--ios-secondary);
  padding:0 4px 8px;display:flex;align-items:center;justify-content:space-between;}

/* SIDEBAR LIST */
.informe-item{padding:12px 14px;border-radius:var(--ios-radius-sm);cursor:pointer;transition:all var(--ios-transition);
  border:1.5px solid transparent;margin-bottom:6px;background:var(--ios-card);}
.informe-item:hover{border-color:var(--ios-separator);}
.informe-item.active{border-color:var(--ios-blue);background:rgba(37,99,235,0.06);}
.informe-item .num{font-weight:700;font-size:0.85rem;color:var(--pp-azul);}
.informe-item .asunto{font-size:0.78rem;color:var(--ios-secondary);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.informe-item .fecha{font-size:0.68rem;color:#94a3b8;margin-top:4px;}
.empty-state{text-align:center;padding:30px 10px;color:var(--ios-secondary);font-size:0.85rem;}

/* TABS */
.tab-bar{display:flex;gap:4px;background:rgba(120,120,128,0.12);padding:4px;border-radius:10px;margin-bottom:16px;}
.tab-btn{flex:1;padding:9px;border:none;background:transparent;border-radius:8px;font-size:0.82rem;font-weight:600;
  color:var(--ios-secondary);cursor:pointer;transition:all var(--ios-transition);}
.tab-btn.active{background:var(--ios-card);color:var(--pp-azul);box-shadow:var(--ios-shadow);}

/* FORM */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media (max-width:600px){.form-grid{grid-template-columns:1fr;}}
.field{margin-bottom:14px;}
.field.full{grid-column:1/-1;}
.firmante-block{border:1px solid var(--ios-separator);border-radius:var(--ios-radius-sm);padding:12px;margin-bottom:10px;position:relative;}
.firmante-row{display:flex;align-items:flex-start;gap:10px;}
.firmante-check-col{display:flex;align-items:center;padding-top:18px;flex-shrink:0;}
.firmante-check-col input[type="checkbox"]{width:20px;height:20px;accent-color:var(--ios-green);cursor:pointer;}

.fotos-section{margin-top:8px;}
.fotos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:8px;}
.foto-slot{position:relative;border:2px dashed var(--ios-separator);border-radius:var(--ios-radius-sm);
  display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;cursor:pointer;
  transition:all var(--ios-transition);overflow:hidden;background:var(--ios-bg);}
.foto-slot:hover{border-color:var(--ios-blue);background:rgba(37,99,235,0.04);}
.foto-slot img{width:100%;height:100%;object-fit:cover;}
.foto-slot .foto-add{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ios-secondary);font-size:0.75rem;}
.foto-slot .foto-add svg{width:28px;height:28px;stroke:var(--ios-secondary);stroke-width:1.5;fill:none;}
.foto-slot .foto-eliminar{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;
  background:var(--ios-red);color:#fff;border:none;font-size:1rem;cursor:pointer;display:flex;
  align-items:center;justify-content:center;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,0.3);}
.foto-slot .foto-eliminar:hover{opacity:0.85;}

/* PREVIEW (mimic PDF) */
.preview-doc,.preview-doc *{font-family:"Courier New",Courier,monospace !important;}
.preview-doc{background:#fff;padding:36px 40px;color:#111;font-size:13px;line-height:1.55;
  border-radius:var(--ios-radius);box-shadow:var(--ios-shadow-lg);}
.preview-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.preview-logo-left img{height:110px;}
.preview-logo-right img{height:110px;}
.preview-informe-box{text-align:center;flex:1;}
.preview-informe-box .titulo{font-weight:700;font-size:18px;margin-bottom:8px;letter-spacing:1px;}
.preview-num-boxes{display:inline-flex;gap:2px;align-items:center;font-weight:700;font-size:15px;}
.pv-box{border:1.5px solid #111;width:25px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;}
.preview-badge{width:64px;}
.preview-badge img{width:100%;}
.preview-meta{margin:18px 0;}
.preview-meta div{margin-bottom:4px;}
.preview-hechos-title{font-weight:700;margin:20px 0 12px;text-decoration:underline;}
.preview-hechos p{margin:0 0 14px;text-align:justify;}
.preview-fecha-lugar{text-align:right;margin:26px 0 10px;}
.preview-firmas{display:flex;justify-content:space-around;margin-top:40px;gap:10px;flex-wrap:wrap;}
.preview-firma{text-align:center;font-size:11px;min-width:150px;}
.preview-firma .rol{font-weight:700;margin-bottom:40px;}
.preview-firma .fdo{border-top:1px solid #111;padding-top:4px;}
.preview-footer{margin-top:30px;border-top:1px solid #ccc;padding-top:6px;font-size:9px;color:#555;}

.preview-foto-page{margin-top:30px;padding:36px 40px;text-align:center;page-break-before:always;
  border-top:2px solid var(--pp-azul);padding-top:20px;}
.preview-foto-title{font-weight:700;font-size:14px;letter-spacing:0.5px;margin-bottom:4px;color:var(--pp-azul);}
.preview-foto-num{font-size:11px;color:var(--ios-secondary);margin-bottom:16px;}
.preview-foto-img{max-width:100%;max-height:520px;object-fit:contain;border:1px solid var(--ios-separator);
  border-radius:var(--ios-radius-sm);box-shadow:var(--ios-shadow);}

/* TOAST */
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 20px;
  border-radius:980px;font-size:0.82rem;font-weight:600;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,0.25);
  animation:toastIn 0.25s ease-out; display:none;}

.ios-input:disabled,.ios-select:disabled,textarea.ios-input:disabled,.digit-box:disabled{
  background:#eef1f5;color:#64748b;cursor:not-allowed;opacity:0.85;}

/* LOADING OVERLAY */
#loading-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.55);backdrop-filter:blur(2px);z-index:95;
  display:none;align-items:center;justify-content:center;}
#loading-overlay .box{background:#fff;border-radius:var(--ios-radius-lg);padding:22px 30px;box-shadow:var(--ios-shadow-lg);
  display:flex;align-items:center;gap:12px;font-weight:600;color:var(--pp-azul);font-size:0.9rem;}
.spinner{width:22px;height:22px;border:3px solid rgba(37,99,235,0.2);border-top-color:var(--ios-blue);
  border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}


.ios-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);z-index:90;
  display:flex;align-items:center;justify-content:center;padding:16px;}
.ios-modal{background:#fff;border-radius:var(--ios-radius-lg);max-width:380px;width:100%;padding:22px;box-shadow:var(--ios-shadow-lg);}
.ios-modal h3{margin:0 0 10px;font-size:1.02rem;}
.ios-modal p{margin:0 0 18px;font-size:0.85rem;color:var(--ios-secondary);}
.ios-modal .btn-row{display:flex;gap:8px;justify-content:flex-end;}

/* PRINT */
#print-area{display:none;}
@media print{
  html,body{background:#fff !important;}
  body > *:not(#print-area){display:none !important;}
  #print-area{display:block !important;}
  #print-area *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
  @page{margin:16mm 14mm;}
}
.print-doc,.print-doc *{font-family:"Courier New",Courier,monospace !important;}
.print-doc{color:#111;font-size:12.5px;line-height:1.5;}
.print-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
.print-logo-left img{height:100px;}
.print-logo-right img{height:100px;}
.print-informe-box{text-align:center;flex:1;}
.print-informe-box .titulo{font-weight:700;font-size:17px;margin-bottom:8px;letter-spacing:1px;}
.print-num-boxes{display:inline-flex;gap:2px;align-items:center;font-weight:700;font-size:14px;}
.pb-box{border:1.5px solid #111;width:24px;height:27px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;}
.print-badge{width:60px;}
.print-badge img{width:100%;}
.print-meta div{margin-bottom:4px;}
.print-hechos-title{font-weight:700;margin:18px 0 10px;text-decoration:underline;}
.print-hechos p{margin:0 0 13px;text-align:justify;}
.print-fecha-lugar{text-align:right;margin:24px 0 8px;}
.print-firmas{display:flex;justify-content:space-around;margin-top:38px;gap:10px;}
.print-firma{text-align:center;font-size:10.5px;min-width:140px;}
.print-firma .rol{font-weight:700;margin-bottom:38px;}
.print-firma .fdo{border-top:1px solid #111;padding-top:4px;}
.print-footer{margin-top:26px;border-top:1px solid #999;padding-top:5px;font-size:8.5px;color:#555;}

.print-foto-page{margin-top:0;padding:20px 24px;text-align:center;page-break-before:always;}
.print-foto-title{font-weight:700;font-size:13px;letter-spacing:0.5px;margin-bottom:3px;color:#111;}
.print-foto-num{font-size:10px;color:#555;margin-bottom:12px;}
.print-foto-img{max-width:100%;max-height:560px;object-fit:contain;}

@media (max-width:640px){
  .pp-brand-title{font-size:0.85rem;}
  .preview-doc{padding:20px 16px;font-size:11.5px;}
  .print-doc{font-size:11px;}
}
</style>
</head>

let dirHandleGuardado = null;

function cargarConfig(){
  return JSON.parse(localStorage.getItem('pp_config') || '{}');
}
function guardarConfig(cfg){
  localStorage.setItem('pp_config', JSON.stringify(cfg));
}
function configDefault(){
  return {
    autorPorDefecto: '',
    primerFdo: '',
    segundoFdo: '',
    tercerFdo: ''
  };
}
function cfgValor(key){
  const c = cargarConfig();
  return c[key] !== undefined ? c[key] : configDefault()[key];
}

function abrirConfig(){
  const c = cargarConfig();
  const d = configDefault();
  const cont = document.getElementById('modal-container');
  cont.innerHTML = `
    <div class="ios-modal-overlay" id="modal-overlay">
      <div class="ios-modal" style="max-width:440px;">
        <h3>⚙️ Configuración</h3>
        <p style="margin-bottom:14px;">Estos valores se aplicarán por defecto al crear nuevos informes.</p>

          <input type="text" class="ios-input" id="cfg-autor" placeholder="Ej: JEFE DE SERVICIO 952" value="${escapeHtml(c.autorPorDefecto || d.autorPorDefecto)}">
        </div>
        <div class="section-title" style="margin-top:4px;"><span>Firmantes por defecto (Fdo.)</span></div>
        <div class="field">
          <label class="ios-label-field">Primer firmante</label>
          <input type="text" class="ios-input" id="cfg-fdo1" placeholder="Ej: 959" value="${escapeHtml(c.primerFdo || d.primerFdo)}">
        </div>
        <div class="field">
          <label class="ios-label-field">Segundo firmante</label>
          <input type="text" class="ios-input" id="cfg-fdo2" placeholder="Ej: Pablo Crabiffose" value="${escapeHtml(c.segundoFdo || d.segundoFdo)}">
        </div>

          <label class="ios-label-field">Tercer firmante</label>

function nuevoId(){ return 'inf_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

function anioActualCorto(){ return new Date().getFullYear().toString().slice(-2); }

function siguienteNumero(anio){
  const usados = informes
    .filter(i=>i.anio===anio)
    .map(i=>parseInt(i.numero||'0',10) || 0);
  const max = usados.length ? Math.max(...usados) : 0;
  return String(max+1).padStart(4,'0');
}

function estadoVacio(){
  const anio = anioActualCorto();
  return {
    id: nuevoId(),
    numero: siguienteNumero(anio), anio: anio, rev:'0',
    de: cfgValor('autorPorDefecto'),
    asunto:'', hechos:'',
    lugar:'El Musel', fecha:new Date().toISOString().slice(0,10),
    firmantes:[
      {rol:'Jefe de Servicio', fdo: cfgValor('primerFdo'), activo:true},
      {rol:'Responsable de Servicio', fdo: cfgValor('segundoFdo'), activo:true},
      {rol:'Jefe del Departamento de Seguridad', fdo: cfgValor('tercerFdo'), activo:true}
    ],
    fotos:[],
    creado: Date.now()
  };
}

let actual = estadoVacio();

/* ===================== UTIL ===================== */
function soloDigitos(el,max){
  el.value = el.value.replace(/\D/g,'').slice(0,max);
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  t.style.animation = 'none'; void t.offsetWidth; t.style.animation = 'toastIn 0.25s ease-out';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>{ t.style.display='none'; }, 2200);
}
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fechaLarga(iso){
  if(!iso) return '';
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const [y,m,d]=iso.split('-').map(Number);
  return `${d} de ${meses[m-1]} de ${y}`;
}
function boxesHTML(str,cls){
  const chars = (str||'').split('');
  if(chars.length===0) return `<span class="${cls}">&nbsp;</span>`;
  return chars.map(c=>`<span class="${cls}">${escapeHtml(c)}</span>`).join('');
}

/* ===================== FOTOS ===================== */
function renderFotos(){
  const cont = document.getElementById('fotos-container');
  const max = 4;
  const fotos = actual.fotos || [];
  document.getElementById('fotos-contador').textContent = `${fotos.length}/${max}`;
  let html = '';
  for(let i=0; i<max; i++){
    if(fotos[i]){
      html += `<div class="foto-slot">
        <img src="${fotos[i]}" alt="Foto ${i+1}">
        <button class="foto-eliminar" onclick="eliminarFoto(${i})" title="Eliminar foto">&times;</button>
      </div>`;
    } else {
      html += `<div class="foto-slot" onclick="document.getElementById('fotos-input').click()">
        <div class="foto-add">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          Añadir foto
        </div>
      </div>`;
    }
  }
  cont.innerHTML = html;
}

function manejarFoto(event){
  const file = event.target.files[0];
  event.target.value = '';
  if(!file) return;
  if(!file.type.startsWith('image/')){
    toast('⚠️ Solo se admiten imágenes');
    return;
  }
  if((actual.fotos||[]).length >= 4){
    toast('⚠️ Máximo 4 fotos');
    return;
  }
  const reader = new FileReader();
  reader.onload = ()=>{
    comprimirImagen(reader.result, 1200, 0.82).then(comprimida=>{
      if(!actual.fotos) actual.fotos = [];
      actual.fotos.push(comprimida);
      renderFotos();
      actualizarPreview();
      toast('📷 Foto añadida');
    });
  };
  reader.readAsDataURL(file);
}

function eliminarFoto(idx){
  actual.fotos.splice(idx, 1);
  renderFotos();
  actualizarPreview();
  toast('🗑️ Foto eliminada');
}

function comprimirImagen(dataUrl, maxAncho, calidad){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > maxAncho){ h = Math.round(h * maxAncho / w); w = maxAncho; }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', calidad));
    };
    img.src = dataUrl;
  });
}

/* ===================== PREVIEW / DOCUMENT BUILD ===================== */
function construirDocumentoHTML(logoImgTag, numBoxClass, badgeClass, cls){
  leerFormAEstado();
  const hechosParrafos = (actual.hechos||'').split(/\n\s*\n/).filter(p=>p.trim().length)
    .map(p=>`<p>${escapeHtml(p.trim()).replace(/\n/g,'<br>')}</p>`).join('');
  const firmasHTML = actual.firmantes.map(f=>`
    <div class="${cls}-firma">
      <div class="rol">${escapeHtml(f.rol||'')}${f.rol?':':''}</div>
      <div class="fdo">Fdo.: ${escapeHtml(f.fdo||'')}</div>
    </div>
  `).join('');

  const fotos = actual.fotos || [];
  let fotosHTML = '';
  if(fotos.length > 0){
    fotosHTML = fotos.map((src,i)=>`
      <div class="${cls}-foto-page">
        <div class="${cls}-foto-title">ANEXO FOTOGRÁFICO ${i+1} de ${fotos.length}</div>
        <div class="${cls}-foto-num">N° ${boxesHTML(actual.numero, numBoxClass)} / ${boxesHTML(actual.anio, numBoxClass)}</div>
        <img src="${src}" class="${cls}-foto-img" alt="Foto ${i+1}">
      </div>
    `).join('');
  }

  return `
    <div class="${cls}-doc">
      <div class="${cls}-header">
        <div class="${cls}-logo-left"><img src="${CABECERA}" alt="cabecera"></div>
        <div class="${cls}-informe-box">
          <div class="titulo">INFORME</div>
          <div class="${cls}-num-boxes">
            N° ${boxesHTML(actual.numero, numBoxClass)}
            &nbsp;/&nbsp;${boxesHTML(actual.anio, numBoxClass)}
            &nbsp;Rev&nbsp;${boxesHTML(actual.rev||'0', numBoxClass)}
          </div>
        </div>
        <div class="${cls}-logo-right">${logoImgTag}</div>
      </div>
      <div class="${cls}-meta">
        <div><b>De:</b> ${escapeHtml(actual.de)}</div>
        <div><b>Asunto:</b> ${escapeHtml(actual.asunto)}</div>
      </div>
      <div class="${cls}-hechos-title">HECHOS</div>
      <div class="${cls}-hechos">${hechosParrafos || '<p style="color:#999;">(Sin redactar)</p>'}</div>
      <div class="${cls}-fecha-lugar">${escapeHtml(actual.lugar)}, a ${fechaLarga(actual.fecha)}</div>
      <div class="${cls}-firmas">${firmasHTML}</div>
      <div class="${cls}-footer">
        Mod. APG 306/05 — Edificio de Servicios Múltiples – El Musel, s/n – 33212 Gijón - Principado de Asturias (España) —
        Tel.+34 985 17 96 00 – www.puertogijon.es
      </div>
    </div>
    ${fotosHTML}
  `;
}

function actualizarPreview(){
  const html = construirDocumentoHTML(
    `<img src="${LOGO}" alt="logo">`,
    'pv-box','preview-badge','preview'
  );
  document.getElementById('preview-doc').innerHTML = html;
}

/* ===================== TABS ===================== */
function cambiarTab(tab){
  document.getElementById('tab-editar').style.display = tab==='editar' ? 'block':'none';
  document.getElementById('tab-vista').style.display = tab==='vista' ? 'block':'none';
  document.getElementById('tab-btn-editar').classList.toggle('active', tab==='editar');
  document.getElementById('tab-btn-vista').classList.toggle('active', tab==='vista');
  if(tab==='vista') actualizarPreview();
}

/* ===================== BLOQUEO DE FORMULARIO ===================== */
function camposFormulario(){
  return [
    document.getElementById('f-numero'),
    document.getElementById('f-anio'),
    document.getElementById('f-rev'),
    document.getElementById('f-de'),
    document.getElementById('f-asunto'),
    document.getElementById('f-hechos'),
    document.getElementById('f-lugar'),
    document.getElementById('f-fecha'),
    ...document.querySelectorAll('.firmante-rol'),
    ...document.querySelectorAll('.firmante-fdo'),
    document.getElementById('fotos-input')
  ];
}
function bloquearFormulario(){
  camposFormulario().forEach(el=>{ if(el) el.disabled = true; });
  const btn = document.getElementById('btn-guardar');
  btn.textContent = '✏️ Editar informe';
  btn.classList.remove('ios-btn-primary');
  btn.classList.add('ios-btn-secondary','light');
  btn.onclick = habilitarEdicion;
}
function desbloquearFormulario(){
  camposFormulario().forEach(el=>{ if(el) el.disabled = false; });
  const btn = document.getElementById('btn-guardar');
  btn.textContent = informeActualId ? '💾 Guardar cambios (PDF)' : '💾 Guardar (genera PDF)';
  btn.classList.remove('ios-btn-secondary','light');
  btn.classList.add('ios-btn-primary');
  btn.onclick = guardarInforme;
}
function habilitarEdicion(){
  leerFormAEstado();
  actual.rev = String((parseInt(actual.rev,10) || 0) + 1);
  document.getElementById('f-rev').value = actual.rev;
  desbloquearFormulario();
  actualizarPreview();
  toast('✏️ Edición habilitada — nueva Rev. ' + actual.rev);
}

/* ===================== CRUD INFORMES ===================== */
function guardarLista(){ localStorage.setItem('pp_informes', JSON.stringify(informes)); }

async function guardarInforme(){
  leerFormAEstado();
  if(!actual.numero){ toast('⚠️ Indica el número de informe'); return; }
  const idx = informes.findIndex(i=>i.id===actual.id);
  actual.actualizado = Date.now();
  if(idx>=0){ informes[idx] = actual; } else { informes.push(actual); }
  informeActualId = actual.id;
  guardarLista();
  renderListaInformes();
  document.getElementById('btn-eliminar').style.display='inline-flex';
  bloquearFormulario();
  toast('✅ Informe guardado');
  await generarPDFArchivo();
}

function nuevoInforme(){
  actual = estadoVacio();
  informeActualId = null;
  cargarFormDesdeEstado(false);
  cambiarTab('editar');
  toast('📝 Nuevo informe');
}

function cargarInforme(id){
  const inf = informes.find(i=>i.id===id);
  if(!inf) return;
  actual = JSON.parse(JSON.stringify(inf));
  if(actual.firmantes){
    actual.firmantes.forEach(f=>{ if(f.activo === undefined) f.activo = true; });
  }
  if(!actual.fotos) actual.fotos = [];
  informeActualId = id;
  cargarFormDesdeEstado(true);
  cambiarTab('editar');
  renderListaInformes();
}

function confirmarEliminar(){
  mostrarModal({
    titulo:'Eliminar informe',
    texto:'Esta acción no se puede deshacer. ¿Deseas eliminar este informe?',
    okTexto:'Eliminar', okClase:'ios-btn-danger',
    onOk: ()=>{
      informes = informes.filter(i=>i.id!==informeActualId);
      guardarLista();
      renderListaInformes();
      nuevoInforme();
      toast('🗑️ Informe eliminado');
    }
  });
}

function renderListaInformes(){
  const cont = document.getElementById('lista-informes');
  const q = (document.getElementById('buscador-informes')?.value || '').trim().toLowerCase();

  let filtrados = informes;
  if(q){
    filtrados = informes.filter(i=>{
      const numCompleto = `${i.numero||''}/${i.anio||''}`.toLowerCase();
      return numCompleto.includes(q) ||
        (i.numero||'').toLowerCase().includes(q) ||
        (i.asunto||'').toLowerCase().includes(q) ||
        (i.de||'').toLowerCase().includes(q) ||
        (i.lugar||'').toLowerCase().includes(q) ||
        (i.hechos||'').toLowerCase().includes(q);
    });
  }

  document.getElementById('contador-informes').textContent = q ? `${filtrados.length}/${informes.length}` : informes.length;

  if(informes.length===0){
    cont.innerHTML = `<div class="empty-state">Aún no hay informes guardados.<br>Crea el primero con "➕ Nuevo".</div>`;
    return;
  }
  if(filtrados.length===0){
    cont.innerHTML = `<div class="empty-state">No se han encontrado informes<br>que coincidan con "${escapeHtml(q)}".</div>`;
    return;
  }

  const ordenados = [...filtrados].sort((a,b)=>(b.actualizado||b.creado)-(a.actualizado||a.creado));
  cont.innerHTML = ordenados.map(i=>`
    <div class="informe-item ${i.id===informeActualId?'active':''}" onclick="cargarInforme('${i.id}')">
      <div class="num">Nº ${escapeHtml(i.numero||'----')}/${escapeHtml(i.anio||'--')} Rev ${escapeHtml(i.rev||'0')}</div>
      <div class="asunto">${escapeHtml(i.asunto || 'Sin asunto')}</div>
      <div class="fecha">${escapeHtml(i.lugar||'')} · ${fechaLarga(i.fecha)}</div>
    </div>
  `).join('');
}

/* ===================== MODAL ===================== */
function mostrarModal({titulo,texto,okTexto,okClase,onOk}){
  const cont = document.getElementById('modal-container');
  cont.innerHTML = `
    <div class="ios-modal-overlay" id="modal-overlay">
      <div class="ios-modal">
        <h3>${escapeHtml(titulo)}</h3>
        <p>${escapeHtml(texto)}</p>
        <div class="btn-row">
          <button class="ios-btn ios-btn-secondary light" onclick="cerrarModal()">Cancelar</button>
          <button class="ios-btn ${okClase}" id="modal-ok-btn">${escapeHtml(okTexto)}</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modal-ok-btn').onclick = ()=>{ cerrarModal(); onOk(); };
  document.getElementById('modal-overlay').onclick = (e)=>{ if(e.target.id==='modal-overlay') cerrarModal(); };
}
function cerrarModal(){ document.getElementById('modal-container').innerHTML=''; }

/* ===================== CARGA / UTILIDADES ===================== */
function mostrarCarga(texto){
  document.getElementById('loading-texto').textContent = texto || 'Procesando…';
  document.getElementById('loading-overlay').style.display = 'flex';
}
function ocultarCarga(){
  document.getElementById('loading-overlay').style.display = 'none';
}

/* ===================== IMPRESIÓN / PDF ===================== */
function nombreArchivoInforme(){
  const numero = (actual.numero || '0000').padStart(4,'0');
  const anio = actual.anio || anioActualCorto();
  const rev = actual.rev || '0';
  const asunto = (actual.asunto || 'SIN ASUNTO').trim();
  let nombre = `Informe ${numero}-${anio} Rev.${rev} ${asunto}`;
  // Sanitiza caracteres no válidos en nombres de archivo (p.ej. la barra "/")
  nombre = nombre.replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim();
  return nombre.slice(0,150);
}

async function generarPDFArchivo(){
  if(!window.html2canvas || !window.jspdf){
    toast('⚠️ No se pudo generar el PDF (librería no disponible)');
    return;
  }
  mostrarCarga('Generando PDF…');
  const contenedor = document.createElement('div');
  try{
    const html = construirDocumentoHTML(
      `<img src="${LOGO}" alt="logo">`,
      'pb-box','print-badge','print'
    );
    contenedor.className = 'print-doc';
    contenedor.style.position = 'fixed';
    contenedor.style.left = '-9999px';
    contenedor.style.top = '0';
    contenedor.style.width = '794px';
    contenedor.style.background = '#ffffff';
    contenedor.style.padding = '40px 44px';
    contenedor.innerHTML = html;
    document.body.appendChild(contenedor);

    const img = contenedor.querySelector('img');
    if(img && !img.complete){
      await new Promise(res=>{ img.onload = res; img.onerror = res; });
    }

    const canvas = await html2canvas(contenedor, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    const imgData = canvas.toDataURL('image/jpeg', 0.95);

    const pdfWidth = 210, pdfHeight = 297;
    const ratio = pdfWidth / canvas.width;
    const imgHeightMm = canvas.height * ratio;

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'mm', format:'a4'});
    let heightLeft = imgHeightMm;
    let position = 0;
    pdf.addImage(imgData, 'JPEG', 0, position, pdfWidth, imgHeightMm);
    heightLeft -= pdfHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeightMm;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, pdfWidth, imgHeightMm);
      heightLeft -= pdfHeight;
    }

    const nombreArchivo = nombreArchivoInforme() + '.pdf';
    const pdfBlob = pdf.output('blob');

    if(dirHandleGuardado){
      try{
        const archivo = await dirHandleGuardado.getFileHandle(nombreArchivo, {create:true});
        const writable = await archivo.createWritable();
        await writable.write(pdfBlob);
        await writable.close();
        toast('✅ PDF guardado en: ' + dirHandleGuardado.name);
        return;
      }catch(e){
        try{
          const permiso = await dirHandleGuardado.requestPermission({mode:'write'});
          if(permiso === 'granted'){
            const archivo = await dirHandleGuardado.getFileHandle(nombreArchivo, {create:true});
            const writable = await archivo.createWritable();
            await writable.write(pdfBlob);
            await writable.close();
            toast('✅ PDF guardado en: ' + dirHandleGuardado.name);
            return;
          }
        }catch(e2){}
      }
    }

    if(window.showDirectoryPicker){
      try{
        ocultarCarga();
        const handle = await window.showDirectoryPicker({mode:'readwrite', startIn:'documents'});
        dirHandleGuardado = handle;
        mostrarCarga('Guardando PDF…');
        const archivo = await handle.getFileHandle(nombreArchivo, {create:true});
        const writable = await archivo.createWritable();
        await writable.write(pdfBlob);
        await writable.close();
        toast('✅ PDF guardado en: ' + handle.name);
        return;
      }catch(e){
        if(e.name === 'AbortError'){
          ocultarCarga();
          return;
        }
        mostrarCarga('Guardando PDF…');
      }
    }

    pdf.save(nombreArchivo);
    toast('✅ PDF descargado');
  }catch(err){
    console.error(err);
    toast('⚠️ No se pudo generar el PDF');
  }finally{
    if(contenedor.parentNode) document.body.removeChild(contenedor);
    ocultarCarga();
  }
}

  leerFormAEstado();
  if(!actual.numero || !actual.asunto){
    toast('⚠️ Completa al menos número y asunto');

}
